[project]
name = "bio-inspired-locomotion"
version = "0.1.0"
description = "Study notes, literature review and motion GIFs for bio-inspired / hybrid / switched locomotion."
readme = "README.md"
requires-python = ">=3.11"
# numpy + matplotlib (with Pillow, the GIF writer) are used by the figure scripts;
# scipy is needed by the sibling state-estimation-simulations modules that
# make_locomotion_gifs.py imports.
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pillow",
    "state-estimation-simulations",
]

# The simulation modules that figures/make_locomotion_gifs.py imports now import each other as the package
# `state_estimation_simulations`, so the submodule is installed (editable) into this environment.
[tool.uv.sources]
state-estimation-simulations = { path = "third_party/state-estimation-simulations", editable = true }
